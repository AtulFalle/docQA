[project]
name = "docqa-core"
version = "0.1.0"
description = "Shared config, logging, telemetry and database layer for docQA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa_core"]

# deptry: declared deps must match imports. psycopg is the SQLAlchemy driver (URL-selected);
[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]
