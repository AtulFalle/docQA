<section class="ask">
    <h1 class="ask__title">Ask</h1>
    <p class="ask__banner" role="status">Answering is coming in M1 (query API)</p>
    <form class="ask__form" [formGroup]="form">
        <label class="ask__label" for="question">Your question</label>
        <textarea
            id="question"
            class="ask__input"
            rows="6"
            formControlName="question"
            [attr.maxlength]="max"
            aria-describedby="counter"
            [attr.aria-invalid]="form.controls.question.invalid && form.controls.question.touched"
        ></textarea>
        <div class="ask__meta">
            <span id="counter">{{ length() }} / {{ max }}</span>
            @if (form.controls.question.touched && form.controls.question.hasError('required')) {
                <span class="ask__error" role="alert">Please enter a question.</span>
            }
        </div>
        <button type="submit" disabled>Ask</button>
    </form>
</section>
