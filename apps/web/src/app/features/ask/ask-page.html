<el-stack gap="6">
    <h1 class="el-text-h2 ask__title">Ask</h1>
    <el-alert color="info" title="Answering is coming in M1 (query API)" />

    <form (submit)="$event.preventDefault()">
        <el-stack gap="2">
            <el-label htmlFor="question" required>Your question</el-label>
            <el-input
                inputId="question"
                name="question"
                placeholder="What does the policy say about…"
                [(value)]="question"
                [error]="error() !== null"
                ariaDescribedby="counter question-error"
                (focusout)="touched.set(true)"
            />
            <el-stack direction="row" justify="between" align="center" wrap>
                <span id="counter" class="el-text-muted">{{ length() }} / {{ max }}</span>
                @if (error(); as message) {
                    <el-form-error id="question-error" role="alert">{{ message }}</el-form-error>
                }
            </el-stack>
            <div>
                <el-button type="submit" iconStart="paper-plane" disabled>Ask</el-button>
            </div>
        </el-stack>
    </form>
</el-stack>
