[project]
name = "docqa-workers"
version = "0.1.0"
description = "docQA Temporal workers (ingestion pipeline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docqa-core",
    "temporalio>=1.8",
]

[project.scripts]
docqa-worker = "docqa_workers.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa_workers"]

[tool.uv.sources]
docqa-core = { workspace = true }
