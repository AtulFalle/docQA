[project]
name = "docqa-ai-api"
version = "0.1.0"
description = "docQA AI service (internal, FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docqa-core",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "starlette",              # imported directly (ASGI types); version governed by fastapi
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.54.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa_ai_api"]

[tool.uv.sources]
docqa-core = { workspace = true }

# deptry: uvicorn is the ASGI server, invoked from the CLI/Dockerfile, never imported.
[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn"]
