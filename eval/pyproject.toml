[project]
name = "docqa-eval"
version = "0.1.0"
description = "Golden-set schema, metrics and validation CLI for docQA retrieval evaluation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
docqa-eval = "docqa_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa_eval"]
