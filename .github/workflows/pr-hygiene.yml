name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    name: Conventional Commit PR title
    runs-on: ubuntu-latest
    steps:
      # Squash-merge uses the PR title as the commit message, so the title is what lands on main.
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            api
            workers
            core
            db
            eval
            infra
            ci
            deps
            docs
            m0
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: Subject must start with a lowercase letter.
