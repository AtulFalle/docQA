name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: backend
            dockerfile: apps/backend/Dockerfile
          - name: ai-api
            dockerfile: services/ai-api/Dockerfile
          - name: ingestion-worker
            dockerfile: services/ingestion-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; repository_owner may contain uppercase letters.
      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/docqa-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Placeholder only. No environment is bound and nothing is deployed yet.
    # The target is decided in docs/adr/0002-deployment-target.md.
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Placeholder
        run: echo "Deployment target not locked yet - see docs/adr/0002-deployment-target.md"
