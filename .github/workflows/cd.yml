name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            # Rebuilt without cache so OS security upgrades are always current.
            no-cache-filters: runtime
          - name: backend
            dockerfile: apps/backend/Dockerfile
          - name: ai-api
            dockerfile: services/ai-api/Dockerfile
            # Rebuilt without cache so OS security upgrades are always current.
            no-cache-filters: runtime
          - name: ingestion-worker
            dockerfile: services/ingestion-worker/Dockerfile
            # Rebuilt without cache so OS security upgrades are always current.
            no-cache-filters: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GHCR image names must be lowercase; repository_owner may contain uppercase letters.
      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/docqa-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          no-cache-filters: ${{ matrix.no-cache-filters }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Placeholder only. No environment is bound and nothing is deployed yet.
    # The target is decided in docs/adr/0002-deployment-target.md.
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Placeholder
        run: echo "Deployment target not locked yet - see docs/adr/0002-deployment-target.md"
