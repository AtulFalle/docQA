# Local development infrastructure for docQA.
#
# Core infra (no profile):  docker compose -f infra/docker/docker-compose.yml up -d
# Containerised app too:    docker compose -f infra/docker/docker-compose.yml --profile app up -d --build
#
# Compose interpolates ${VAR} from infra/docker/.env (not the repo-root .env).
# The Langfuse secrets below have local-only defaults; override them in infra/docker/.env if needed.

name: docqa

# Shared app environment. Hosts point at compose service names (the repo-root .env is
# for running Python directly on the host, where localhost is correct).
x-app-env: &app-env
  DOCQA_ENV: local
  DOCQA_LOG_JSON: 'true'
  DOCQA_DATABASE_URL: postgresql+psycopg://docqa:docqa@postgres:5432/docqa
  DOCQA_REDIS_URL: redis://redis:6379/0
  DOCQA_QDRANT_URL: http://qdrant:6333
  DOCQA_S3_ENDPOINT_URL: http://minio:9000
  DOCQA_TEMPORAL_ADDRESS: temporal:7233
  DOCQA_OTEL_ENABLED: 'true'
  DOCQA_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the temporal, temporal_visibility and langfuse databases on first init only.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docqa -d docqa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/docqa-raw
    restart: 'no'

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: docqa
      POSTGRES_PWD: docqa
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - '7233:7233'

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '8080:8080'

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://docqa:docqa@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-nextauth-secret-change-me}
      SALT: ${LANGFUSE_SALT:-local-dev-salt-change-me}
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: 'false'
    ports:
      - '3001:3000'

  otel-lgtm:
    # Grafana + Tempo (traces) + Loki (logs) + Prometheus (metrics) + OTel collector in one image.
    image: grafana/otel-lgtm:0.8.1
    ports:
      - '3002:3000' # Grafana UI (host 3002; 3000 is the NestJS backend)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

  # ---------------------------------------------------------------------------
  # Application services (`--profile app`). Request path:
  #   browser -> web (nginx, /api proxy) -> backend (NestJS) -> ai-api (Python, internal)
  # ---------------------------------------------------------------------------
  backend-migrate:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: migrate
    image: docqa-backend-migrate:local
    environment:
      DATABASE_URL: postgresql://docqa:docqa@postgres:5432/docqa
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: docqa-backend:local
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://docqa:docqa@postgres:5432/docqa
      AI_SERVICE_URL: http://ai-api:8000
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    ports:
      - '3000:3000'
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      ai-api:
        condition: service_started

  web:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: docqa-web:local
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - '8088:8080' # open http://localhost:8088 (8080 is the Temporal UI)
    depends_on:
      - backend

  ai-api:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: services/ai-api/Dockerfile
    image: docqa-ai-api:local
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *app-env
    ports:
      - '8001:8000' # internal AI service; exposed on the host for local debugging only
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

  worker:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: services/ingestion-worker/Dockerfile
    image: docqa-worker:local
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *app-env
    depends_on:
      - temporal

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
